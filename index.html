<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nigerian Accent Text-to-Speech</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Nigerian Accent Text-to-Speech</h1>
        <p class="subtitle">Enter text to hear it in a natural Nigerian-accented English voice.</p>
        <textarea id="text-input" placeholder="Enter English text here..."></textarea>
        <div class="controls">
            <button id="speak-btn">Speak</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
